name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and libraries
        run: pip install pyinstaller python-docx lxml pillow

      - name: Build app
        run: >
          pyinstaller --windowed --clean --noconfirm
          --name "HTML Image Extractor"
          --osx-bundle-identifier com.local.htmlimageextractor
          --collect-all docx
          html_image_extractor.py

      - name: Pack the app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/HTML Image Extractor.app" "HTML-Image-Extractor-macOS.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Image-Extractor-macOS
          path: HTML-Image-Extractor-macOS.zip
