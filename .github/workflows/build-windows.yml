name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name HTML-Image-Extractor html-image-extractor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Image-Extractor-Windows
          path: dist/HTML-Image-Extractor.exe
